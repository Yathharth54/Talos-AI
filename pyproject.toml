[project]
name = "talos-ai"
version = "0.1.0"
description = "A LangGraph-based self-evolving agent that forges, tests, and accumulates reusable tools at runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yathharth Karanjikar" }]
requires-python = ">=3.11"
keywords = ["langgraph", "langchain", "llm", "agents", "self-improving", "tool-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langsmith>=0.1.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.urls]
Homepage = "https://talos-ai-umber.vercel.app"
Repository = "https://github.com/Yathharth54/Talos-AI"
Issues = "https://github.com/Yathharth54/Talos-AI/issues"

[project.scripts]
talos = "talos.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
# The repo-root alembic/ folder holds migrations, not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the LLM verbatim; don't reflow it for a line limit.
"talos/prompts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default `python_functions = test` matches anything prefixed "test", which
# accidentally collects helpers like `tester_node`. Require an underscore.
python_functions = ["test_*"]
# Async tests (persistence, event streams) run without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real Postgres; run with `-m integration` and DATABASE_URL set",
]
