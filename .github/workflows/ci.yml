name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      # Mocked suite only: no API keys needed. Live tests stay behind RUN_LIVE=1.
      - run: uv run pytest -q

  # Postgres integration suite (spec 03 §6). The conftest gate runs these only
  # with DATABASE_URL exported and `-m integration`.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talos
          POSTGRES_PASSWORD: talos
          POSTGRES_DB: talos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://talos:talos@localhost:5432/talos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m integration

  # Proves the image builds (spec 03 §6). Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build .
      - run: cp .env.example .env && docker compose -f compose.yml -f compose.dev.yml -f compose.test.yml config --quiet

  # Frontend: lint, types, unit tests, build, then the two Playwright suites.
  # Visual: ref-* writes baselines from the reference in this run, demo-* compares
  # (no PNGs are committed; needs Google Fonts reachable). Live: serve_backend.py
  # drops and creates talos_e2e through the service's `postgres` database (the
  # talos role is a superuser), then serves the fake-graph backend on 8765.
  # Live runs with workers: 1 and no retries (see playwright.live.config.ts):
  # live-mobile first, 09-keys last.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talos
          POSTGRES_PASSWORD: talos
          POSTGRES_DB: talos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://talos:talos@localhost:5432/talos_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:visual
      - run: npm run e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
